title: Alberto Quaini
name: Alberto Quaini
description: Assistant Professor at Erasmus School of Economics, Erasmus University Rotterdam.
url: https://albertoquaini.com
baseurl: ""
locale: en-US
timezone: Europe/Amsterdam

include:
  - _pages
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - temp
  - vendor
  - .bundle
  - .sass-cache
  - .jekyll-cache

defaults:
  - scope:
      path: ""
    values:
      layout: clean

markdown: kramdown
kramdown:
  input: Kramdown
plugins:
  - jekyll-redirect-from
  - jekyll-sitemap
